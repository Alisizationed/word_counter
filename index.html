<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Counter</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; padding: 1.2em; }
  main { max-width: 1200px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.2em; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; }
  input { font: inherit; padding: .5em .8em; border: 1px solid #333; border-radius: 8px; background: #1b1b1b; color: #eee; width: 11em; }
  .top { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; justify-content: space-between; margin-bottom: 1em; }
  .grp { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
  .main-btn { padding: .55em 1.2em; background: #eee; color: #111; }
  .ghost { padding: .55em 1em; background: #2a2a2a; color: #eee; }
  .total { opacity: .7; }
  .total b { color: #fff; font-weight: 600; }
  .heard { font-size: .85rem; padding: .25em .8em; border-radius: 8px; background: #1e3a5f; color: #9cc9ff; visibility: hidden; }
  .heard.on { visibility: visible; }
  .state { font-size: .85rem; padding: .25em .8em; border-radius: 8px; background: #2a2a2a; color: #aaa; display: inline-flex; align-items: center; gap: .5em; }
  .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .state.on { color: #8fe3a8; }
  .state.on::before { background: #2fd163; }
  .state.err { color: #ff9a9a; }
  .state.err::before { background: #ff5a5a; }
  .sum { background: #16283d; border: 1px solid #2c5282; border-radius: 10px; padding: .8em 1em; margin-bottom: 1em; }
  .sum .big { font-size: 1.3rem; margin: .1em 0; }
  .sum .big b { color: #9cc9ff; font-weight: 600; }
  .sum .sub { opacity: .7; font-size: .85rem; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .6em; }
  .tile { background: #1b1b1b; border: 2px solid #1b1b1b; border-radius: 10px; padding: .6em .7em; }
  .tile.hot { border-color: #3b8cff; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: .5em; }
  .name { font-size: .85rem; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-size: 1.7rem; font-weight: 600; line-height: 1.1; }
  .zero .name, .zero .num { opacity: .35; }
  .bar { height: 4px; border-radius: 2px; background: #2a2a2a; margin: .5em 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #3b8cff; }
  .ctl { display: flex; gap: .3em; }
  .ctl button { flex: 1; padding: .3em 0; background: #2a2a2a; color: #eee; font-size: 1rem; }
  .ctl button:hover { background: #3a3a3a; }
  .ctl .del { flex: 0 0 2em; color: #aaa; }
  .empty { opacity: .5; padding: 1em 0; }
  .hist { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: .9em; position: sticky; top: 1em; max-height: calc(100vh - 2em); overflow: auto; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6em; }
  .hist-head h2 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  .hist-head button { padding: .3em .8em; background: #2a2a2a; color: #aaa; font-size: .85rem; }
  details { background: #1b1b1b; border-radius: 10px; padding: .6em .9em; margin-bottom: .5em; }
  summary { cursor: pointer; display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
  summary .meta { opacity: .6; font-size: .85rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .4em; margin-top: .6em; }
  .chip { background: #2a2a2a; border-radius: 8px; padding: .2em .7em; font-size: .85rem; }
  .chip b { font-weight: 600; margin-left: .3em; }
  .none { opacity: .5; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="grp">
      <button class="main-btn" id="startBtn">Start</button>
      <button class="ghost" id="resetBtn">Reset</button>
      <span class="state" id="msg">Mic off</span>
      <span class="total">Total: <b id="totalEl">0</b></span>
      <span class="heard" id="heardEl"></span>
    </div>
    <div class="grp">
      <input id="filterBox" placeholder="Filter words" autocomplete="off">
      <form class="grp" id="addForm">
        <input id="newWord" placeholder="Add a word" autocomplete="off">
        <button class="ghost" type="submit">Add</button>
      </form>
    </div>
  </div>
  <div class="layout">
    <div>
      <div id="summary"></div>
      <div id="grid"></div>
    </div>
    <aside class="hist">
      <div class="hist-head"><h2>History</h2><button id="clearHist">Clear history</button></div>
      <div id="histList"></div>
    </aside>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const grid = $("grid"), totalEl = $("totalEl"), heardEl = $("heardEl"), msg = $("msg");
const setState = (text, cls) => { msg.textContent = text; msg.className = "state " + (cls || ""); };

let WORDS = ["express", "internship"];
try { const s = JSON.parse(localStorage.getItem("words")); if (Array.isArray(s) && s.length) WORDS = s; } catch (e) {}
let history = [];
try { const h = JSON.parse(localStorage.getItem("history")); if (Array.isArray(h)) history = h; } catch (e) {}

const counts = {};
WORDS.forEach(w => counts[w] = 0);
let seen = {}, listening = false, hot = null, hotTimer = null, sessionStart = null, lastSummary = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rx = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const save = () => { try { localStorage.setItem("words", JSON.stringify(WORDS)); } catch (e) {} };
const saveHistory = () => { try { localStorage.setItem("history", JSON.stringify(history)); } catch (e) {} };
const fmtDur = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
const fmtDate = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

function topOf(entries) {
  if (!entries.length) return null;
  const best = entries[0][1];
  return { words: entries.filter(e => e[1] === best).map(e => e[0]), n: best };
}

function render() {
  const q = $("filterBox").value.trim().toLowerCase();
  const max = Math.max(1, ...WORDS.map(w => counts[w]));
  const list = WORDS.map((w, i) => ({ w, i }))
    .filter(x => x.w.includes(q))
    .sort((a, b) => counts[b.w] - counts[a.w] || a.i - b.i);

  grid.innerHTML = list.length ? list.map(({ w }) => {
    const n = counts[w], a = esc(w);
    return `<div class="tile ${w === hot ? "hot" : ""} ${n === 0 ? "zero" : ""}">
      <div class="row"><span class="name" title="${a}">${a}</span><span class="num">${n}</span></div>
      <div class="bar"><i style="width:${Math.round(n / max * 100)}%"></i></div>
      <div class="ctl">
        <button data-a="minus" data-w="${a}" title="Subtract 1">−</button>
        <button data-a="plus" data-w="${a}" title="Add 1">+</button>
        <button class="del" data-a="del" data-w="${a}" title="Remove word">×</button>
      </div></div>`;
  }).join("") : `<div class="empty">No words match.</div>`;

  totalEl.textContent = WORDS.reduce((s, w) => s + counts[w], 0);
  heardEl.textContent = hot ? "Just heard: " + hot : "";
  heardEl.classList.toggle("on", !!hot);
}

function renderSummary() {
  const s = lastSummary;
  if (!s) { $("summary").innerHTML = ""; return; }
  const top = topOf(s.entries);
  const line = top
    ? `Most popular: <b>${top.words.map(esc).join(" and ")}</b> (${top.n}${top.words.length > 1 ? " each" : ""})`
    : "No tracked words were heard.";
  $("summary").innerHTML = `<div class="sum"><div class="sub">Recording finished</div><div class="big">${line}</div><div class="sub">${s.total} total · ${fmtDur(s.dur)}</div></div>`;
}

function renderHistory() {
  $("clearHist").style.display = history.length ? "" : "none";
  $("histList").innerHTML = history.length ? history.map(h => {
    const top = topOf(h.entries);
    const label = top ? `${top.words.map(esc).join(" and ")} (${top.n})` : "—";
    return `<details><summary><span>Most popular: <b>${label}</b></span><span class="meta">${fmtDate(h.t)} · ${fmtDur(h.dur)} · ${h.total} total</span></summary>
      <div class="chips">${h.entries.map(([w, n]) => `<span class="chip">${esc(w)}<b>${n}</b></span>`).join("")}</div></details>`;
  }).join("") : `<div class="none">Finished recordings will appear here.</div>`;
}

function startSession() {
  WORDS.forEach(w => counts[w] = 0);
  seen = {}; hot = null; lastSummary = null;
  sessionStart = Date.now();
  renderSummary(); render();
}

function endSession() {
  if (!sessionStart) return;
  const entries = WORDS.map(w => [w, counts[w]]).filter(e => e[1] > 0).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  const dur = Math.round((Date.now() - sessionStart) / 1000);
  lastSummary = { t: sessionStart, dur, entries, total };
  if (total > 0) { history.unshift(lastSummary); history = history.slice(0, 50); saveHistory(); }
  sessionStart = null; hot = null;
  renderSummary(); renderHistory(); render();
}

grid.onclick = e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const word = btn.dataset.w, act = btn.dataset.a;
  if (act === "plus") counts[word]++;
  else if (act === "minus") counts[word] = Math.max(0, counts[word] - 1);
  else if (act === "del") { delete counts[word]; WORDS = WORDS.filter(x => x !== word); save(); }
  render();
};

$("addForm").onsubmit = e => {
  e.preventDefault();
  const v = $("newWord").value.trim().toLowerCase();
  if (v && !WORDS.includes(v)) { WORDS.push(v); counts[v] = 0; save(); }
  $("newWord").value = "";
  render();
};

$("filterBox").oninput = render;
$("resetBtn").onclick = () => { WORDS.forEach(w => counts[w] = 0); hot = null; render(); };
$("clearHist").onclick = () => { if (confirm("Delete all history?")) { history = []; saveHistory(); renderHistory(); } };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  setState("Use Chrome or Edge", "err");
  $("startBtn").disabled = true;
} else {
  const R = new SR();
  R.continuous = true; R.interimResults = true; R.lang = "en-US";

  R.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = e.results[i][0].transcript.toLowerCase();
      for (const word of WORDS) {
        const n = (text.match(new RegExp("\\b" + rx(word) + "\\b", "g")) || []).length;
        const key = i + ":" + word;
        if (n > (seen[key] || 0)) {
          counts[word] += n - (seen[key] || 0);
          seen[key] = n;
          hot = word;
          clearTimeout(hotTimer);
          hotTimer = setTimeout(() => { hot = null; render(); }, 2000);
        }
      }
    }
    render();
  };
  R.onstart = () => setState("Listening", "on");
  R.onend = () => {
    seen = {};
    if (listening) { R.start(); return; }
    if (!msg.classList.contains("err")) setState("Mic off");
    endSession();
  };
  R.onerror = e => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    setState(e.error === "not-allowed" ? "Mic blocked" : "Error: " + e.error, "err");
    if (e.error === "not-allowed") { listening = false; sessionStart = null; $("startBtn").textContent = "Start"; }
  };

  $("startBtn").onclick = () => {
    if (listening) { listening = false; R.stop(); $("startBtn").textContent = "Start"; }
    else { startSession(); listening = true; R.start(); $("startBtn").textContent = "Stop"; }
  };
}

renderHistory();
render();
</script>
</body>
</html>
